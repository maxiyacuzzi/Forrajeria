[build]
  command = "next build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # Turbopack's build cache stores env values to detect changes; it is never
  # published, so the secrets scan would flag server-only vars there falsely.
  SECRETS_SCAN_OMIT_PATHS = ".netlify/.next/cache/**,.next/cache/**"

[[plugins]]
  package = "@netlify/plugin-nextjs"
