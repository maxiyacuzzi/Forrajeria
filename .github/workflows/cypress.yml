name: Cypress E2E Tests

on:
  push:
  pull_request:

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    # CYPRESS_TEST_EMAIL / CYPRESS_TEST_PASSWORD live as secrets on this
    # GitHub Environment (Settings > Environments > test-cypress) rather than
    # as plain repo secrets — env-scoped secrets are only visible to a job
    # that declares this key.
    environment: test-cypress
    env:
      # Supabase's publishable anon key for Stage — safe to keep here, same
      # as it's safe embedded in client JS.
      NEXT_PUBLIC_SUPABASE_URL: https://aavcpxcswvlkoqpqgmxg.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_P836ht1I5LVNYvMm2IrLfA_6DI5mvdE
      CYPRESS_TEST_EMAIL: ${{ secrets.CYPRESS_TEST_EMAIL }}
      CYPRESS_TEST_PASSWORD: ${{ secrets.CYPRESS_TEST_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          build: npm run build
          start: npm run start
          wait-on: "http://localhost:3000"
          wait-on-timeout: 60

      - name: Upload screenshots (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore

      - name: Upload videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: cypress/videos
          if-no-files-found: ignore
